<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBA COTC - Input SKU Wajib</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="appbar">
    <h1>COTC - SKU Wajib</h1>
    <p>Input mingguan untuk SBA</p>
  </header>

  <div class="card">
    <div class="row2">
      <div>
        <label class="field-label">Area</label>
        <select id="areaSel"></select>
      </div>
      <div>
        <label class="field-label">Toko</label>
        <select id="storeSel"></select>
      </div>
    </div>
    <p id="scopeInfo" class="upload-status"></p>
  </div>

  <div class="card">
    <div class="row2">
      <div>
        <label class="field-label">Bulan</label>
        <select id="monthSel"></select>
      </div>
      <div>
        <label class="field-label">Minggu (Senin - Minggu)</label>
        <select id="weekSel"></select>
      </div>
    </div>
  </div>

  <div id="reminderBanner" class="banner info"></div>

  <div class="card">
    <div class="progress-label">
      <span id="progLabel">-</span>
      <span id="progPct">-</span>
    </div>
    <div class="progress-track"><div id="progBar" class="progress-fill" style="width:0%"></div></div>
  </div>

  <div class="tabs">
    <button id="tabInput" class="active">Input</button>
    <button id="tabRecap">Rekap<span id="recapBadge" class="tab-badge" style="display:none;"></span></button>
    <button id="tabStock">Stock distributor</button>
  </div>

  <div id="viewInput" class="view">
    <input id="searchBox" type="text" placeholder="Cari nama produk">
    <div class="chip-row" id="flagFilterRow"></div>
    <div id="skuList"></div>
  </div>

  <div id="viewRecap" class="view hidden"></div>

  <div id="viewStock" class="view hidden">
    <div class="card">
      <label class="field-label">Sumber stock untuk area</label>
      <select id="stockAreaSel">
        <option value="Sorong">Sorong</option>
        <option value="Timika">Timika</option>
      </select>
      <p id="stockCurrentInfo" class="upload-status">Belum ada data.</p>
      <label class="field-label" style="margin-top:10px;">Upload file (format UID Distributor Stock Report)</label>
      <input id="stockFileInput" type="file" accept=".xlsx,.xls">
      <p id="stockParsePreview" class="upload-status"></p>
      <button id="stockSaveBtn" class="primary" style="margin-top:8px; width:100%;" disabled>Simpan ke database</button>
    </div>
  </div>

  <div id="modalBackdrop" class="modal-backdrop">
    <div class="modal-box">
      <h3>Data belum lengkap</h3>
      <p id="modalBody"></p>
      <div class="modal-actions">
        <button id="modalReview">Tinjau ulang</button>
        <button id="modalConfirm" class="danger-outline">Kirim, isi 0</button>
      </div>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
