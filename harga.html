<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survei Harga - Perfect Stores</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .price-row {
    background: var(--surface-muted);
    border-radius: var(--radius);
    padding: 8px 10px;
    margin-top: 8px;
  }
  .price-row-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .price-row-head label { font-size: 12px; color: var(--text-secondary); }
  .price-input-wrap { display: flex; align-items: center; gap: 4px; }
  .price-input-wrap span { font-size: 12px; color: var(--text-muted); }
  .price-input-wrap input { width: 100%; }
  .rsp-note { font-size: 11px; color: var(--text-muted); margin: 2px 0 6px; }
  .competitor-item {
    border-top: 1px dashed var(--border);
    padding-top: 6px;
    margin-top: 6px;
  }
  .competitor-name-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .competitor-name { font-size: 12px; margin: 0 0 4px; }
  .competitor-edit-btn {
    font-size: 11px;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0 0 4px;
    cursor: pointer;
    flex: none;
  }
  .add-competitor-btn {
    font-size: 12px;
    color: var(--accent);
    background: none;
    border: none;
    padding: 6px 0 0;
    cursor: pointer;
    text-align: left;
  }
  .competitor-form {
    background: var(--surface);
    border: 1px dashed var(--accent);
    border-radius: var(--radius);
    padding: 8px;
    margin-top: 6px;
  }
  .competitor-form input { margin-bottom: 6px; }
  .badge.flag-none { background: var(--surface-muted); color: var(--text-muted); }
</style>
</head>
<body>
<div class="app">

  <header class="appbar">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h1>Survei Harga</h1>
        <p>Bulanan - 8 toko LMT SPM (EC BIG) + 2 toko Beauty</p>
      </div>
      <a href="index.html" style="font-size:12px; color:var(--accent); text-decoration:none;">&larr; Input SKU</a>
    </div>
  </header>

  <div class="card">
    <div class="row2">
      <div>
        <label class="field-label">Toko</label>
        <select id="storeSel"></select>
      </div>
      <div>
        <label class="field-label">Bulan</label>
        <select id="monthSel"></select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="progress-label">
      <span id="progLabel">-</span>
      <span id="progPct">-</span>
    </div>
    <div class="progress-track"><div id="progBar" class="progress-fill" style="width:0%"></div></div>
  </div>

  <div class="card">
    <p class="section-title" style="margin:0 0 8px;">Upload SKU Promo (opsional, per Channel, berlaku 1 bulan berjalan)</p>
    <p class="upload-status">SKU Promo tidak menjadi kewajiban SBA -- cuma tambahan info ketersediaan &amp; harga.</p>
    <div class="row2" style="margin-top:8px;">
      <div>
        <label class="field-label">Channel</label>
        <select id="promoChannelSel"></select>
      </div>
      <div>
        <label class="field-label">File (kolom: SKU Code Mapping, SKU Description Current, RSP)</label>
        <input id="promoFileInput" type="file" accept=".xlsx,.xls">
      </div>
    </div>
    <p id="promoCurrentInfo" class="upload-status" style="margin-top:8px;"></p>
    <p id="promoParsePreview" class="upload-status"></p>
    <button id="promoSaveBtn" class="primary" style="margin-top:6px; width:100%;" disabled>Simpan SKU Promo</button>
  </div>

  <div class="search-row">
    <input id="searchBox" type="text" placeholder="Cari nama produk atau barcode">
    <button id="scanBtn" type="button" title="Scan barcode">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M3 6V4a1 1 0 0 1 1-1h2M3 18v2a1 1 0 0 0 1 1h2M21 6V4a1 1 0 0 0-1-1h-2M21 18v2a1 1 0 0 1-1 1h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6 7v10M9 7v10M12 7v10M14 7v10M17 7v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="chip-row" id="flagFilterRow"></div>

  <div id="productList"></div>

  <div id="scanModal" class="modal-backdrop">
    <div class="modal-box scan-box">
      <div class="scan-header">
        <strong>Scan barcode</strong>
        <button id="scanCloseBtn" type="button">Tutup</button>
      </div>
      <video id="scanVideo" playsinline muted></video>
      <div id="scanFallbackContainer"></div>
      <p id="scanStatus" class="upload-status" style="padding:0 14px 12px;">Arahkan kamera ke barcode produk.</p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

</div>
<script type="module" src="js/harga.js?v=5"></script>
</body>
</html>
