<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survei Harga - Perfect Stores</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .price-row {
    background: var(--surface-muted);
    border-radius: var(--radius);
    padding: 8px 10px;
    margin-top: 8px;
  }
  .price-row-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .price-row-head label { font-size: 12px; color: var(--text-secondary); }
  .price-input-wrap { display: flex; align-items: center; gap: 4px; }
  .price-input-wrap span { font-size: 12px; color: var(--text-muted); }
  .price-input-wrap input { width: 100%; }
  .rsp-note { font-size: 11px; color: var(--text-muted); margin: 2px 0 6px; }
  .competitor-item {
    border-top: 1px dashed var(--border);
    padding-top: 6px;
    margin-top: 6px;
  }
  .competitor-name { font-size: 12px; margin: 0 0 4px; }
  .add-competitor-btn {
    font-size: 12px;
    color: var(--accent);
    background: none;
    border: none;
    padding: 6px 0 0;
    cursor: pointer;
    text-align: left;
  }
  .competitor-form {
    background: var(--surface);
    border: 1px dashed var(--accent);
    border-radius: var(--radius);
    padding: 8px;
    margin-top: 6px;
  }
  .competitor-form input { margin-bottom: 6px; }
  .badge.flag-none { background: var(--surface-muted); color: var(--text-muted); }
</style>
</head>
<body>
<div class="app">

  <header class="appbar">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h1>Survei Harga</h1>
        <p>Bulanan - 8 toko LMT SPM (EC BIG)</p>
      </div>
      <a href="index.html" style="font-size:12px; color:var(--accent); text-decoration:none;">&larr; Input SKU</a>
    </div>
  </header>

  <div class="card">
    <div class="row2">
      <div>
        <label class="field-label">Toko</label>
        <select id="storeSel"></select>
      </div>
      <div>
        <label class="field-label">Bulan</label>
        <select id="monthSel"></select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="progress-label">
      <span id="progLabel">-</span>
      <span id="progPct">-</span>
    </div>
    <div class="progress-track"><div id="progBar" class="progress-fill" style="width:0%"></div></div>
  </div>

  <input id="searchBox" type="text" placeholder="Cari nama produk atau barcode" style="margin-bottom:10px;">
  <div class="chip-row" id="flagFilterRow"></div>

  <div id="productList"></div>

  <div id="toast" class="toast"></div>

</div>
<script type="module" src="js/harga.js?v=1"></script>
</body>
</html>
